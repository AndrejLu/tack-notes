<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    * { box-sizing: border-box; margin: 0; }
    body {
      width: 440px;
      height: 500px;
      display: grid;
      place-items: center;
      background: #d8d2c6;
      font-family: "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
    }
    .note {
      width: 340px;
      height: 400px;
      background: #fff6a5;
      border-radius: 4px 4px 12px 12px;
      box-shadow: 0 14px 36px rgba(28, 26, 22, 0.22);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      color: #1c1a16;
    }
    .titlebar {
      height: 26px; background: #f0e07a;
      display: flex; justify-content: flex-end;
    }
    .tb { width: 32px; opacity: 0.55; font-size: 11px; display: grid; place-items: center; }
    .toolbar {
      display: flex; gap: 2px; padding: 5px 8px;
      border-bottom: 1px solid rgba(0,0,0,0.08); font-size: 12px; font-weight: 600; opacity: 0.75;
    }
    .toolbar span { width: 24px; height: 22px; display: grid; place-items: center; }
    .saved { margin-left: auto; font-size: 10px; font-weight: 500; opacity: 0.5; padding-right: 4px; align-self: center; }
    .body { padding: 14px 16px; font-size: 15px; line-height: 1.35; flex: 1; }
    ul { margin: 8px 0 0; padding-left: 0; list-style: none; }
    li { margin: 4px 0; }
    li::before { content: "☐ "; }
    li.done::before { content: "☑ "; }
  </style>
</head>
<body>
  <div class="note">
    <div class="titlebar"><span class="tb">─</span><span class="tb">✕</span></div>
    <div class="toolbar">
      <span><strong>B</strong></span><span><em>I</em></span>
      <span style="text-decoration:underline">U</span><span style="text-decoration:line-through">S</span>
      <span>•</span><span>☑</span><span class="saved">Saved</span>
    </div>
    <div class="body">
      <strong>Team standup</strong><br /><br />
      Agenda<br />
      • Demo progress<br />
      • Blockers<br />
      • Next milestones<br /><br />
      Follow-ups
      <ul>
        <li class="done">Share notes</li>
        <li>Update board</li>
        <li>Schedule review</li>
      </ul>
    </div>
  </div>
</body>
</html>
